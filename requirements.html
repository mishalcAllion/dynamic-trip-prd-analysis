<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requirements Breakdown -- PRD Analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script>window.CURRENT_PAGE = 'requirements';</script>
  <script src="nav.js"></script>
  <script src="tooltips.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono, code, [class*="font-mono"] { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

    /* Accordion transition */
    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      opacity: 0;
    }
    .accordion-body.expanded {
      opacity: 1;
    }

    /* Chevron rotation */
    .chevron-icon {
      transition: transform 0.25s ease;
    }
    .chevron-icon.rotated {
      transform: rotate(180deg);
    }

    /* Smooth scroll */
    html { scroll-behavior: smooth; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Highlight flash for scroll-to targets */
    @keyframes highlight-flash {
      0% { background-color: rgba(59, 130, 246, 0.15); }
      100% { background-color: transparent; }
    }
    .highlight-flash {
      animation: highlight-flash 1.5s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Nav root -->
  <div id="nav-root"></div>

  <!-- Main content -->
  <main class="ml-0 lg:ml-[260px] min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-8">

      <!-- Page header -->
      <header class="mb-8">
        <h1 class="text-2xl font-semibold text-slate-100 tracking-tight">Requirements Breakdown</h1>
        <p class="text-sm text-slate-500 mt-1" id="page-subtitle">Loading...</p>
      </header>

      <!-- Filter bar -->
      <div class="flex flex-wrap items-center gap-3 mb-6" id="filter-bar">
        <!-- Group filter buttons injected by JS -->
        <div id="group-filters" class="flex flex-wrap items-center gap-2"></div>
        <!-- Search -->
        <div class="ml-auto relative">
          <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="Search tickets..."
            class="bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-300 pl-9 pr-4 py-2 w-64 focus:outline-none focus:border-slate-600 focus:ring-1 focus:ring-slate-600 placeholder:text-slate-600 transition-colors" />
        </div>
      </div>

      <!-- Accordion ticket list -->
      <div id="ticket-list" class="space-y-2"></div>

      <!-- Summary footer -->
      <footer id="summary-footer" class="mt-10 border-t border-slate-800 pt-6 pb-12">
        <div class="flex items-center gap-6 text-sm text-slate-500">
          <div id="footer-tickets" class="font-mono"></div>
          <div class="w-px h-4 bg-slate-800"></div>
          <div id="footer-subissues" class="font-mono"></div>
          <div class="w-px h-4 bg-slate-800"></div>
          <div id="footer-points" class="font-mono"></div>
        </div>
      </footer>

    </div>
  </main>

  <script>
  (function() {
    // ---- State ----
    let activeGroup = 'all';
    let searchQuery = '';
    let expandedTickets = new Set();

    // ---- DOM refs ----
    const subtitleEl = document.getElementById('page-subtitle');
    const groupFiltersEl = document.getElementById('group-filters');
    const searchInput = document.getElementById('search-input');
    const ticketListEl = document.getElementById('ticket-list');
    const footerTickets = document.getElementById('footer-tickets');
    const footerSubissues = document.getElementById('footer-subissues');
    const footerPoints = document.getElementById('footer-points');

    // ---- Init ----
    function init() {
      const c = DATA.computed;
      subtitleEl.textContent = `${c.totalParentTickets} tickets / ${c.totalSubIssues} sub-issues across ${DATA.groups.length} groups`;

      renderGroupFilters();
      renderTickets();
      renderFooter();

      searchInput.addEventListener('input', function() {
        searchQuery = this.value.trim().toLowerCase();
        renderTickets();
      });

      // Handle hash links on load (e.g. #ticket-P1)
      if (window.location.hash) {
        const targetId = window.location.hash.substring(1);
        setTimeout(() => scrollToTicket(targetId), 300);
      }
    }

    // ---- Group filter buttons ----
    function renderGroupFilters() {
      const filters = [
        { id: 'all', label: 'All', colorClasses: { active: 'bg-slate-100 text-slate-900', inactive: 'border-slate-600 text-slate-400 hover:text-slate-200 hover:border-slate-500' } },
      ];
      DATA.groups.forEach(g => {
        const gc = Theme.groupColor(g.id);
        filters.push({
          id: g.id,
          label: g.label,
          colorClasses: {
            active: `${g.bgClass} ${g.textClass} border ${g.borderClass}`,
            inactive: `border-slate-700 text-slate-500 hover:${g.textClass} hover:${g.borderClass}`
          }
        });
      });

      groupFiltersEl.innerHTML = filters.map(f => {
        const isActive = activeGroup === f.id;
        const classes = isActive ? f.colorClasses.active : f.colorClasses.inactive;
        const count = f.id === 'all' ? DATA.tickets.length : DATA.tickets.filter(t => t.group === f.id).length;
        return `<button data-filter="${f.id}"
          class="px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${classes}"
          >${f.label} <span class="font-mono opacity-70">${count}</span></button>`;
      }).join('');

      groupFiltersEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          activeGroup = btn.getAttribute('data-filter');
          renderGroupFilters();
          renderTickets();
        });
      });
    }

    // ---- Filter tickets ----
    function getFilteredTickets() {
      return DATA.tickets.filter(t => {
        if (activeGroup !== 'all' && t.group !== activeGroup) return false;
        if (searchQuery) {
          const haystack = `${t.id} ${t.title}`.toLowerCase();
          if (!haystack.includes(searchQuery)) return false;
        }
        return true;
      });
    }

    // ---- Render ticket list ----
    function renderTickets() {
      const filtered = getFilteredTickets();
      if (filtered.length === 0) {
        ticketListEl.innerHTML = `
          <div class="text-center py-16">
            <svg class="w-12 h-12 text-slate-700 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <p class="text-slate-500 text-sm">No tickets match your filters</p>
          </div>`;
        return;
      }

      // Group tickets for visual headers
      let currentGroup = null;
      let html = '';

      filtered.forEach(t => {
        // Group header
        if (t.group !== currentGroup) {
          currentGroup = t.group;
          const gc = Theme.groupColor(t.group);
          const groupObj = DATA.groups.find(g => g.id === t.group);
          const groupTickets = filtered.filter(ft => ft.group === t.group);
          const gMin = groupTickets.reduce((s, ft) => s + ft.pointsMin, 0);
          const gMax = groupTickets.reduce((s, ft) => s + ft.pointsMax, 0);
          html += `
            <div class="flex items-center gap-3 mt-6 mb-3 first:mt-0">
              <div class="w-2 h-2 rounded-full ${gc.dot}"></div>
              <span class="text-xs font-semibold uppercase tracking-wider ${gc.text}">${groupObj ? groupObj.label : t.group}</span>
              <span class="text-xs text-slate-600 font-mono">${groupTickets.length} tickets / ${Theme.points(gMin, gMax)}</span>
              <div class="flex-1 border-t border-slate-800/50"></div>
            </div>`;
        }

        const gc = Theme.groupColor(t.group);
        const isExpanded = expandedTickets.has(t.id);
        const subCount = (t.subIssues || []).length;

        // Collapsed row
        html += `
          <div id="ticket-${t.id}" class="rounded-lg border border-slate-800 bg-slate-900 overflow-hidden transition-colors hover:border-slate-700">
            <!-- Header row -->
            <button class="w-full flex items-center gap-3 px-4 py-3 text-left group" onclick="toggleTicket('${t.id}')">
              <div class="w-2 h-2 rounded-full ${gc.dot} shrink-0"></div>
              <span class="font-mono text-xs ${gc.text} font-medium shrink-0 w-8">${t.id}</span>
              <span class="text-sm text-slate-200 font-medium flex-1 truncate group-hover:text-slate-100">${Theme.escapeHtml(t.title)}</span>
              <span class="shrink-0">${Theme.assigneeBadge(t.assignee)}</span>
              <span class="font-mono text-xs text-slate-500 shrink-0 w-20 text-right">${Theme.points(t.pointsMin, t.pointsMax)}</span>
              ${subCount > 0
                ? `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-800 text-slate-400 text-xs font-mono shrink-0">${subCount}</span>`
                : `<span class="w-6 shrink-0"></span>`}
              <svg class="w-4 h-4 text-slate-500 shrink-0 chevron-icon ${isExpanded ? 'rotated' : ''}" id="chevron-${t.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Expanded body -->
            <div class="accordion-body ${isExpanded ? 'expanded' : ''}" id="body-${t.id}" ${isExpanded ? `style="max-height:2000px"` : ''}>
              <div class="px-4 pb-4 pt-1 border-t border-slate-800/50 space-y-4">

                <!-- Description -->
                ${t.description ? `<p class="text-sm text-slate-400 leading-relaxed">${Theme.escapeHtml(t.description)}</p>` : ''}

                <!-- Dependencies + Blocks -->
                ${renderDepsBlocks(t)}

                <!-- Reference badges -->
                ${renderRefBadges(t)}

                <!-- Sub-issues table -->
                ${renderSubIssuesTable(t)}

                <!-- Impact if removed -->
                ${t.impactIfRemoved ? `
                  <div class="bg-red-500/5 border border-red-500/20 rounded-lg p-3">
                    <div class="flex items-center gap-2 mb-1.5">
                      <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                      </svg>
                      <span class="text-xs font-semibold text-red-400 uppercase tracking-wider">Impact if Removed</span>
                    </div>
                    <p class="text-sm text-red-300/80 leading-relaxed">${Theme.escapeHtml(t.impactIfRemoved)}</p>
                  </div>` : ''}
              </div>
            </div>
          </div>`;
      });

      ticketListEl.innerHTML = html;
    }

    // ---- Dependencies and Blocks row ----
    function renderDepsBlocks(t) {
      const deps = t.dependencies || [];
      const blocks = t.blocksTickets || [];
      if (deps.length === 0 && blocks.length === 0) return '';

      let html = '<div class="flex flex-wrap items-start gap-x-6 gap-y-2">';

      if (deps.length > 0) {
        html += `<div class="flex items-center gap-2">
          <span class="text-[10px] font-bold uppercase tracking-widest text-slate-600 shrink-0">Depends on</span>
          <div class="flex flex-wrap gap-1.5">
            ${deps.map(d => {
              const depTicket = DATA.tickets.find(dt => dt.id === d);
              const gc = depTicket ? Theme.groupColor(depTicket.group) : Theme.groupColor('prereq');
              return `<a href="#ticket-${d}" onclick="event.stopPropagation(); scrollToTicket('ticket-${d}')"
                class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-mono ${gc.bg} ${gc.text} border ${gc.border} hover:brightness-125 transition-all cursor-pointer">
                <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                ${d}
              </a>`;
            }).join('')}
          </div>
        </div>`;
      }

      if (blocks.length > 0) {
        html += `<div class="flex items-center gap-2">
          <span class="text-[10px] font-bold uppercase tracking-widest text-slate-600 shrink-0">Blocks</span>
          <div class="flex flex-wrap gap-1.5">
            ${blocks.map(b => {
              const blockTicket = DATA.tickets.find(bt => bt.id === b);
              const gc = blockTicket ? Theme.groupColor(blockTicket.group) : Theme.groupColor('core');
              return `<a href="#ticket-${b}" onclick="event.stopPropagation(); scrollToTicket('ticket-${b}')"
                class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-mono ${gc.bg} ${gc.text} border ${gc.border} hover:brightness-125 transition-all cursor-pointer">
                <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                ${b}
              </a>`;
            }).join('')}
          </div>
        </div>`;
      }

      html += '</div>';
      return html;
    }

    // ---- Reference badges ----
    function renderRefBadges(t) {
      const prd = t.prdRef ? prdBadge(t.prdRef) : '';
      const figma = t.figmaRef ? figmaBadge(t.figmaRef) : '';
      if (!prd && !figma) return '';
      return `<div class="flex items-center gap-2">
        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-600 shrink-0">Source</span>
        ${prd}${figma}
      </div>`;
    }

    // ---- Sub-issues table ----
    function renderSubIssuesTable(t) {
      const subs = t.subIssues || [];
      if (subs.length === 0) return '';

      let html = `
        <div>
          <div class="text-[10px] font-bold uppercase tracking-widest text-slate-600 mb-2">Sub-issues (${subs.length})</div>
          <div class="rounded-lg border border-slate-800 overflow-hidden">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-slate-800/40 text-slate-500 text-xs">
                  <th class="text-left font-medium px-3 py-2 w-16">ID</th>
                  <th class="text-left font-medium px-3 py-2">Title</th>
                  <th class="text-left font-medium px-3 py-2 w-28">Assignee</th>
                  <th class="text-right font-medium px-3 py-2 w-24">Points</th>
                  <th class="text-right font-medium px-3 py-2 w-16">Ref</th>
                </tr>
              </thead>
              <tbody>`;

      subs.forEach((sub, i) => {
        const rowBg = i % 2 === 0 ? 'bg-slate-900/50' : 'bg-slate-900/20';
        html += `
          <tr class="${rowBg} border-t border-slate-800/30">
            <td class="px-3 py-2 font-mono text-xs text-slate-500">${sub.id}</td>
            <td class="px-3 py-2 text-sm text-slate-300">${Theme.escapeHtml(sub.title)}</td>
            <td class="px-3 py-2">${Theme.assigneeBadge(sub.assignee)}</td>
            <td class="px-3 py-2 text-right font-mono text-xs text-slate-500">${Theme.points(sub.pointsMin, sub.pointsMax)}</td>
            <td class="px-3 py-2 text-right">${sub.prdRef ? prdBadge(sub.prdRef) : ''}</td>
          </tr>`;
      });

      html += `</tbody></table></div></div>`;
      return html;
    }

    // ---- Footer ----
    function renderFooter() {
      const c = DATA.computed;
      footerTickets.textContent = `${c.totalParentTickets} tickets`;
      footerSubissues.textContent = `${c.totalSubIssues} sub-issues`;
      footerPoints.textContent = `${Theme.points(c.totalPointsMin, c.totalPointsMax)} total`;
    }

    // ---- Toggle accordion ----
    window.toggleTicket = function(id) {
      const body = document.getElementById('body-' + id);
      const chevron = document.getElementById('chevron-' + id);
      if (!body) return;

      if (expandedTickets.has(id)) {
        expandedTickets.delete(id);
        body.style.maxHeight = body.scrollHeight + 'px';
        // Force reflow
        body.offsetHeight;
        body.style.maxHeight = '0';
        body.classList.remove('expanded');
        if (chevron) chevron.classList.remove('rotated');
      } else {
        expandedTickets.add(id);
        body.style.maxHeight = body.scrollHeight + 'px';
        body.classList.add('expanded');
        if (chevron) chevron.classList.add('rotated');
        // After transition, remove explicit max-height so content can grow
        body.addEventListener('transitionend', function handler() {
          if (expandedTickets.has(id)) {
            body.style.maxHeight = 'none';
          }
          body.removeEventListener('transitionend', handler);
        });
      }
    };

    // ---- Scroll to ticket ----
    window.scrollToTicket = function(elementId) {
      // Ensure we have the right format
      const id = elementId.startsWith('ticket-') ? elementId : 'ticket-' + elementId;
      const ticketId = id.replace('ticket-', '');

      // If ticket is filtered out, reset filters first
      const ticket = DATA.tickets.find(t => t.id === ticketId);
      if (ticket) {
        const filtered = getFilteredTickets();
        if (!filtered.find(t => t.id === ticketId)) {
          activeGroup = 'all';
          searchQuery = '';
          searchInput.value = '';
          renderGroupFilters();
          renderTickets();
        }
      }

      // Expand the ticket if collapsed
      if (!expandedTickets.has(ticketId)) {
        // Need to wait for render, then toggle
        requestAnimationFrame(() => {
          toggleTicket(ticketId);
        });
      }

      // Scroll to it
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('highlight-flash');
          setTimeout(() => el.classList.remove('highlight-flash'), 1600);
        }
      });
    };

    // ---- Boot ----
    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
